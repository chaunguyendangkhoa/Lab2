<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration Form</h1>

    <form>

        First Name :
        <input type="text" name="firstname" placeholder="Enter First Name">
        <br><br>

        Last Name :
        <input type="text" name="lastname" placeholder="Enter Last Name">
        <br><br>

        Email :
        <input type="text" name="email" placeholder="Enter Email Address">
        <br><br>

        Password :
        <input type="password" name="password">
        <br><br>

        Gender:
        <br>

        Male
        <input type="radio" name="gender" value="male">
        <br>

        Female
        <input type="radio" name="gender" value="female">
        <br>

        Other
        <input type="radio" name="gender" value="other">
        <br><br>

        Age :
        <input type="number" name="age">
        <br><br>

        Preferences :
        <br>

        Acrylic Painting
        <input type="checkbox" name="preference" value="acrylic">
        <br>

        Oil Painting
        <input type="checkbox" name="preference" value="oil">
        <br>

        Water Color Painting
        <input type="checkbox" name="preference" value="water">
        <br><br>

        Select Occupation

        <select name="occupation">
            <option>Student</option>
            <option>Teacher</option>
            <option>Doctor</option>
            <option>Engineer</option>
        </select>

        <br><br>

        Bio
        <br>

        <textarea name="bio" rows="8" cols="45"
            placeholder="Share few lines about yourself..."></textarea>

        <br><br>

        <input type="reset" value="RESET">

        <input type="submit" value="SUBMIT">

    </form>

</body>

</html>
